description: >-
  Lootex is winding down its consumer Web3 products after eight years of
  operation and pivoting to full-stack AI/Web3 development partnerships and
  open-source contributions. The consumer marketplace, Studio, and Biru social
  platform are being sunset; user assets are non-custodial and remain in
  users' own wallets.
