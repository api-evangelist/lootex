name: Lootex
description: >-
  Lootex is a Web3 infrastructure and AI application development company with
  eight years in the blockchain space, backed by 500 Global. It built a
  multi-chain NFT marketplace (Seaport protocol with aggregator support), the
  Lootex Studio minting tool, the Biru social platform, and Lootex Plus (an API
  and SDK offering to mint, trade, and integrate NFTs into apps and games). Its
  core marketplace infrastructure — a NestJS backend and Next.js frontend with
  blockchain event indexing and Web3 wallet authentication — is published as
  open source under Apache-2.0. Lootex is now sunsetting its consumer products
  (marketplace, Studio, and Biru wind down on 2026-04-04; assets stay in users'
  own non-custodial wallets) and pivoting to full-stack AI/Web3 development
  partnerships and open-source contributions.
